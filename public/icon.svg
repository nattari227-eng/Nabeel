<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgEmeraldObsidian" cx="50%" cy="46%" r="60%">
      <stop offset="0%" stop-color="#115938" />
      <stop offset="52%" stop-color="#073822" />
      <stop offset="88%" stop-color="#08080A" />
      <stop offset="100%" stop-color="#08080A" />
    </radialGradient>
    <linearGradient id="gold24k" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#FFFBE0" />
      <stop offset="28%" stop-color="#F5D675" />
      <stop offset="60%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#8A6310" />
    </linearGradient>
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF7C8" />
      <stop offset="50%" stop-color="#C89B27" />
      <stop offset="100%" stop-color="#F7DA7E" />
    </linearGradient>
  </defs>

  <!-- Full-bleed royal black & emerald backdrop -->
  <rect width="512" height="512" fill="url(#bgEmeraldObsidian)" />

  <!-- Outer subtle gold circular halo -->
  <circle cx="256" cy="256" r="196" fill="none" stroke="url(#gold24k)" stroke-width="3" opacity="0.55" />

  <!-- Rub el Hizb 8-point geometric star medallion within safe zone -->
  <g transform="translate(256 256)">
    <rect x="-126" y="-126" width="252" height="252" rx="14" fill="#062818" fill-opacity="0.72" stroke="url(#goldRim)" stroke-width="10" />
    <rect x="-126" y="-126" width="252" height="252" rx="14" fill="#062818" fill-opacity="0.72" stroke="url(#goldRim)" stroke-width="10" transform="rotate(45)" />

    <rect x="-106" y="-106" width="212" height="212" rx="10" fill="none" stroke="url(#gold24k)" stroke-width="3.5" opacity="0.85" />
    <rect x="-106" y="-106" width="212" height="212" rx="10" fill="none" stroke="url(#gold24k)" stroke-width="3.5" opacity="0.85" transform="rotate(45)" />

    <!-- Inner rosette medallion -->
    <circle cx="0" cy="0" r="76" fill="#073822" stroke="url(#gold24k)" stroke-width="5" />
    <circle cx="0" cy="0" r="62" fill="none" stroke="#FFF4BD" stroke-width="1.5" stroke-dasharray="5 5" opacity="0.8" />

    <!-- Central 8-petal geometric flower -->
    <g fill="url(#gold24k)" opacity="0.95">
      <ellipse cx="0" cy="-34" rx="10" ry="22" />
      <ellipse cx="0" cy="-34" rx="10" ry="22" transform="rotate(45)" />
      <ellipse cx="0" cy="-34" rx="10" ry="22" transform="rotate(90)" />
      <ellipse cx="0" cy="-34" rx="10" ry="22" transform="rotate(135)" />
      <ellipse cx="0" cy="-34" rx="10" ry="22" transform="rotate(180)" />
      <ellipse cx="0" cy="-34" rx="10" ry="22" transform="rotate(225)" />
      <ellipse cx="0" cy="-34" rx="10" ry="22" transform="rotate(270)" />
      <ellipse cx="0" cy="-34" rx="10" ry="22" transform="rotate(315)" />
    </g>
    <circle cx="0" cy="0" r="14" fill="#08080A" stroke="url(#gold24k)" stroke-width="4" />
  </g>
</svg>
